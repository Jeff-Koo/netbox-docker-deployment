services:
  netbox:
    image: lscr.io/linuxserver/netbox:latest
    container_name: netbox
    depends_on:
      - postgres
      - redis
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - ALLOWED_HOST=${ALLOWED_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      # - REDIS_USERNAME=${REDIS_USERNAME}
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB_TASK=${REDIS_DB_TASK}
      - REDIS_DB_CACHE=${REDIS_DB_CACHE}
      - BASE_PATH=${BASE_PATH:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - REMOTE_AUTH_ENABLED=${REMOTE_AUTH_ENABLED:-}
      - REMOTE_AUTH_BACKEND=${REMOTE_AUTH_BACKEND:-}
      - REMOTE_AUTH_HEADER=${REMOTE_AUTH_HEADER:-}
      - REMOTE_AUTH_AUTO_CREATE_USER=${REMOTE_AUTH_AUTO_CREATE_USER:-}
      - REMOTE_AUTH_DEFAULT_GROUPS=${REMOTE_AUTH_DEFAULT_GROUPS:-}
      - REMOTE_AUTH_DEFAULT_PERMISSIONS=${REMOTE_AUTH_DEFAULT_PERMISSIONS:-}
    volumes:
      - ./config:/config
    # ports:
    #   - 8000:8000
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.netbox-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.netbox-app.entrypoints=websecure"
      - "traefik.http.routers.netbox-app.tls=true"
      - "traefik.http.routers.netbox-app.tls.certresolver=dns-challenge-cloudflare"
      - "traefik.http.services.netbox-app.loadbalancer.server.port=8000"
    networks:
      - traefik-proxy
      - netbox-network

  postgres:
    image: postgres:16-alpine
    container_name: netbox-postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - netbox-network

  redis:
    image: redis:7-alpine
    container_name: netbox-redis
    volumes:
      - ./redis:/data
    restart: unless-stopped
    networks:
      - netbox-network

networks:
  netbox-network:
    name: netbox-network
  traefik-proxy:
    name: traefik
    external: true
